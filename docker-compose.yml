# Base stack. `make up` layers docker-compose.dev.yml on top of this;
# `make prod-up` layers docker-compose.prod.yml instead.
#
# Secrets use the `${VAR:?message}` form on purpose: compose refuses to start
# rather than silently falling back to a published default password.

name: agno-agentos-openwebui

services:
  agentos-db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: agentos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ai}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS must be set in .env (run `make setup`)}
      POSTGRES_DB: ${DB_NAME:-agentos}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai} -d ${DB_NAME:-agentos}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  agentos-otel:
    image: arizephoenix/phoenix:version-20.23.0
    container_name: agentos-otel
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OTEL_UI_PORT:-6006}:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      # Phoenix's assistant and playground speak OpenAI. Point them at the
      # same OpenRouter key and base URL the agents use.
      OPENAI_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    volumes:
      - otel_data:/mnt/data

  agentos-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agno-agentos-api:local
    container_name: agentos-api
    # Open WebUI is configured with http://oap-api:8000/v1. The service name
    # stays agentos-api; this alias is the name that connection dials.
    networks:
      default:
        aliases:
          - oap-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Derived from the DB_* parts so the two can never drift apart.
      DATABASE_URL: postgresql+psycopg://${DB_USER:-ai}:${DB_PASS:?DB_PASS must be set in .env}@agentos-db:5432/${DB_NAME:-agentos}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://agentos-otel:6006}
    volumes:
      - ./workspace_files:/app/workspace_files
      - openwebui_data:/app/openwebui_data:ro
    depends_on:
      agentos-db:
        condition: service_healthy
      agentos-otel:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.3
    container_name: open-webui
    restart: unless-stopped
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: ${OPENAI_API_BASE_URLS:-http://agentos-api:8000/v1}
      OPENAI_API_KEYS: ${OS_SECURITY_KEY:?OS_SECURITY_KEY must be set in .env}
      # Applied on a fresh WebUI database. An existing database keeps the
      # connection it already saved; the oap-api alias above is what makes
      # that saved URL resolve.
      OPENAI_API_CONFIGS: '{"0":{"enable":true,"tags":["AgentOS"],"prefix_id":"","model_ids":[],"connection_type":"external"}}'
      DEFAULT_MODELS: ${DEFAULT_MODELS:-agno}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set in .env}
      WEBUI_NAME: ${WEBUI_NAME:-Open Agent Platform}
      TASK_MODEL_EXTERNAL: ${TASK_MODEL_EXTERNAL:-platform-manager}
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      agentos-api:
        condition: service_healthy

volumes:
  pgdata:
  openwebui_data:
  otel_data:
